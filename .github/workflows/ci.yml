name: CI/CD pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  linter:
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run HTML and CSS linters
        run: npm run lint:html && npm run lint:css

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: linter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image name
        id: vars
        shell: bash
        run: |
          echo "image_name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t "${{ steps.vars.outputs.image_name }}:${{ github.sha }}" .

      - name: Save Docker image as artifact
        run: docker save "${{ steps.vars.outputs.image_name }}:${{ github.sha }}" | gzip > docker-image.tar.gz

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz
          retention-days: 1

  push-image:
    name: Push image to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Generate image name
        id: vars
        shell: bash
        run: |
          echo "image_name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Load Docker image
        run: gunzip -c docker-image.tar.gz | docker load

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create latest tag
        run: docker tag "${{ steps.vars.outputs.image_name }}:${{ github.sha }}" "${{ steps.vars.outputs.image_name }}:latest"

      - name: Push image with SHA tag
        run: docker push "${{ steps.vars.outputs.image_name }}:${{ github.sha }}"

      - name: Push image with latest tag
        run: docker push "${{ steps.vars.outputs.image_name }}:latest"
